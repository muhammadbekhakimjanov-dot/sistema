{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h2>Системага кирүү</h2>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    {% if form.errors %}<p class="err">Логин же сырсөз туура эмес.</p>{% endif %}
    <button class="btn">Кирүү</button>
  </form>
</div>
{% endblock %}
