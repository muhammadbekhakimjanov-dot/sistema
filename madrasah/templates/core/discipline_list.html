{% extends 'base.html' %}
{% block title %}Тартип жана балдар{% endblock %}

{% block content %}
<h3 class="fw-bold text-dark mb-4"><i class="fa-solid fa-scale-balanced text-primary me-2"></i>Тартип жана балдар</h3>

<div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">№</th>
                        <th>Окуучу</th>
                        <th>Статусу</th>
                    </tr>
                </thead>
                <tbody>
                    {% for student in students %}
                    <tr>
                        <td class="ps-4 fw-bold">{{ forloop.counter }}</td>
                        <td class="fw-semibold text-dark">{{ student.name }}</td>
                        <td><span class="badge bg-success rounded-pill px-3">Үлгүлүү</span></td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3" class="text-center py-4 text-muted">Тизме бош.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
