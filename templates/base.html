<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Медресе Бошқарув Тизими{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Чап тарафдаги меню (Sidebar) -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse py-4 px-3 border-end" style="min-height: 100vh;">
                <h4 class="h5 text-primary fw-bold mb-3">Медресе Менюси</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-dark p-2 rounded bg-white shadow-sm" href="#">Асосий саҳифа</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark p-2 rounded" href="#">Ўқувчилар</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark p-2 rounded" href="#">Ўқитувчилар</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark p-2 rounded" href="#">Давомат</a></li>
                </ul>
            </nav>

            <!-- Асосий контент қисми -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
